<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZL3AVR Emulator — ATmega32</title>
    <meta
      name="description"
      content="Wirtualny zestaw ZL3AVR z mikrokontrolerem ATmega32: edytor, kompilator C w przeglądarce, płytka z ręcznie prowadzonymi przewodami, terminal szeregowy i podgląd rejestrów."
    />
    <meta name="theme-color" content="#1e1e1e" />
    <!--
      Ikona zakladki: kawalek plytki z ukladem w obudowie DIP i linijka diod.
      SVG jest wersja pierwsza (ostra w kazdym rozmiarze), a .ico zostaje dla
      przegladarek, ktore SVG nie przyjmuja, i dla skrotow przypinanych
      w systemie. Oba pliki powstaja z jednego wzoru - patrz tools/make-favicon.mjs.

      "?v=" w adresie jest KONIECZNE dla kazdego, kto odwiedzil strone, zanim
      ikona istniala: przegladarki trzymaja ikony w osobnej pamieci podrecznej,
      ktorej zwykle przeladowanie strony nie odswieza - zapamietany "brak ikony"
      potrafi zostac na tygodnie. Nowy adres to dla tej pamieci nowa ikona.
      Przy zmianie znaku podbij numer w OBU wierszach.
    -->
    <link rel="icon" href="./favicon.svg?v=1" type="image/svg+xml" />
    <link rel="alternate icon" href="./favicon.ico?v=1" sizes="16x16 32x32" />
    <!--
      Wlacza izolacje miedzy zrodlami na hostingu, ktory nie umie ustawic naglowkow
      (np. GitHub Pages). Bez niej nie ma pamieci dzielonej, a bez pamieci dzielonej
      skrypt Pythona nie ma jak poczekac na ramke z plytki. Serwer deweloperski
      ustawia te naglowki sam i wtedy ten skrypt nic nie robi.
      Ladujemy go PRZED aplikacja, zeby ewentualne przeladowanie stalo sie od razu.
    -->
    <script src="./coi-serviceworker.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
