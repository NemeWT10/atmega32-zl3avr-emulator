<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="ZL3AVR Emulator">
  <title>ZL3AVR Emulator</title>
  <!--
    Znak narzedzia: kawalek plytki drukowanej z ukladem scalonym w obudowie DIP
    i linijka trzech swiecacych diod. To dwie rzeczy, ktore widac na tym zestawie
    najpierw - i dwie, ktore da sie jeszcze rozpoznac przy 16 pikselach.
  -->
  <rect x="0" y="0" width="32" height="32" rx="6" fill="#1f6f43" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="5.4" fill="none" stroke="#0d3b25" stroke-width="1.5" />

  <!-- wyprowadzenia obudowy -->
  <g fill="#d9a441">
    <rect x="4.5" y="10.5" width="3.5" height="2" rx="0.5" />
    <rect x="4.5" y="14.5" width="3.5" height="2" rx="0.5" />
    <rect x="4.5" y="18.5" width="3.5" height="2" rx="0.5" />
    <rect x="24" y="10.5" width="3.5" height="2" rx="0.5" />
    <rect x="24" y="14.5" width="3.5" height="2" rx="0.5" />
    <rect x="24" y="18.5" width="3.5" height="2" rx="0.5" />
  </g>

  <!-- obudowa ukladu, z wciecien wskazujacym pin 1 -->
  <rect x="8" y="7" width="16" height="15" rx="1.2" fill="#17171a" />
  <circle cx="16" cy="9.2" r="1.7" fill="#2e2e33" />

  <!-- diody LED -->
  <g fill="#ff3b30">
    <circle cx="9.5" cy="26.5" r="2.1" />
    <circle cx="16" cy="26.5" r="2.1" />
    <circle cx="22.5" cy="26.5" r="2.1" />
  </g>
</svg>
